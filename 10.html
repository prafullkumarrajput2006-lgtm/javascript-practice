<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="10.css">

</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://media.licdn.com/dms/image/sync/v2/D5627AQFJXKy7w6dxiw/articleshare-shrink_800/articleshare-shrink_800/0/1721422742405?e=2147483647&v=beta&t=IU6iTJmn9hJ0nYmNg-RQ5Y2y41HW_O2GHHwYdSSLFLc" alt="Rock">
 </div>


        <div class="choice" id="paper"> 
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223645/paper.jpeg" alt="Paper">
 </div>



        <div class="choice" id="scissors">
            <img src="https://i.pinimg.com/474x/67/eb/fd/67ebfd32e898b4ec3ae4e59ae33832c8.jpg" alt="Scissor">
 </div>



    </div>



    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="score">
            <p id="computer-score">0</p>
            <p>Computer</p>
        </div>
    </div>


    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>


    <script src="10.js">

    </script>
</body>
</html>
